name: WebGPU demo Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'baseline/**'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '01_attention_basics/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'baseline/**'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '01_attention_basics/**'
  workflow_dispatch:

permissions:
  contents: read

# PRs have independent groups. Do not interrupt an active production deployment.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-export.txt
          npm --prefix web ci
      - name: Python and JavaScript checks
        run: |
          python -m unittest discover -s tests -v
          python 01_attention_basics/self_attention_step_by_step.py
          npm --prefix web test
      - name: Train seeded CPU classifier and validate ONNX exports
        run: |
          python -m baseline.run --devices cpu --seed 7 --steps 200 --length 32 --lengths 16 32 64 --warmup 1 --repeats 1 --output results/pages-training --checkpoint results/pages-training/transformer.pt
          python -m baseline.export --checkpoint results/pages-training/transformer.pt --output web/model --lengths 2 16 32 64
      - name: Assemble and validate static Pages artifact
        run: npm --prefix web run build:pages
      - name: Install Chrome for browser checks
        run: npx --prefix web playwright install --with-deps chrome
      - name: Static subpath and available WebGPU integration checks
        run: npm --prefix web run test:pages
      - name: Save validation evidence (including explicit GPU skips)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-validation
          path: |
            web/test-results/
            results/pages-training/*.json
            results/pages-training/report.md
            web/model/manifest.json
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: results/pages/transformer-from-scratch-lab

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish tested static artifact
        id: deployment
        uses: actions/deploy-pages@v4
